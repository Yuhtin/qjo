name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Núcleo, CLI, LSP e conformidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Inclui os testes de conformidade e a comparação do C++ gerado (g++ vem no runner).
      - run: cargo test --all
      - run: cargo build -p qjo-wasm --target wasm32-unknown-unknown --profile release-wasm

  vscode:
    name: Extensão VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npx tsc -p .
      - run: npm run build && npm run servidor
      - run: xvfb-run -a node test/run.mjs
      - run: npx vsce package --target linux-x64 -o qjo-linux-x64.vsix
