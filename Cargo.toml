[workspace]
resolver = "3"
members = ["crates/qjo-core", "crates/qjo-cli", "crates/qjo-lsp", "crates/qjo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Yuhtin/qjo"
authors = ["Davi Duarte"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
