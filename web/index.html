<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QueijoCode</title>
<meta name="description" content="Treine Q?JO!: editor com diagnósticos, simulador e exercícios. Compila para C++.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
<header class="top">
  <div class="brand">Queijo<b>Code</b> <small>Q?JO! → C++</small></div>
  <div class="crumb" id="crumb" hidden><span class="sep">/</span><span class="where" id="crumb-where"></span></div>
  <div class="top-actions">
    <button class="btn ghost" id="b-sair" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Rascunho livre</button>
    <a class="btn ghost" href="https://github.com/Yuhtin/qjo" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
    <button class="btn" id="b-treinar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg><span id="b-treinar-t">Treinar exercícios</span></button>
  </div>
</header>

<main class="app">
  <section class="desc" aria-label="Exercício">
    <div class="tabs" role="tablist" data-group="desc">
      <button class="tab" role="tab" aria-selected="true" data-tab="descricao">Descrição</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="solucao">Solução</button>
    </div>
    <div class="panel" id="p-descricao" role="tabpanel"></div>
    <div class="panel" id="p-solucao" role="tabpanel" hidden></div>
  </section>

  <section class="work">
    <div class="toolbar">
      <span class="fname" id="fname">rascunho.qjo</span>
      <button class="btn ghost sm" id="b-reset" type="button">Restaurar início</button>
      <button class="btn ghost sm" id="b-cpp" type="button" title="Copia o programa traduzido para C++">Copiar C++</button>
      <button class="btn" id="b-sim" type="button">Simular</button>
      <button class="btn primary" id="b-test" type="button">Rodar testes</button>
    </div>
    <div class="editor" id="editor"></div>
    <div class="diags" id="diags" aria-live="polite"></div>
  </section>

  <section class="out" aria-label="Resultado">
    <div class="tabs" role="tablist" data-group="out">
      <button class="tab" role="tab" aria-selected="false" data-tab="testes" id="t-testes">Testes<span class="badge" id="badge-testes">–</span></button>
      <button class="tab" role="tab" aria-selected="true" data-tab="sim">Simulador</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="tok">Tokens</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cpp">C++</button>
    </div>
    <div class="panel" id="p-testes" role="tabpanel" hidden></div>
    <div class="panel" id="p-sim" role="tabpanel"></div>
    <div class="panel" id="p-tok" role="tabpanel" hidden></div>
    <div class="panel" id="p-cpp" role="tabpanel" hidden></div>
  </section>
</main>

<dialog class="modal" id="modal" aria-labelledby="m-title">
  <div class="m-inner">
    <div class="m-head">
      <div><h2 id="m-title">Treinar exercícios</h2><p>Cada exercício tem enunciado, casos de teste e uma solução escondida.</p></div>
      <button class="btn ghost sm" type="button" data-act="fechar-modal" aria-label="Fechar">Fechar</button>
    </div>
    <div class="m-progress"><div class="bar" aria-hidden="true"><span id="m-bar"></span></div><span class="txt" id="m-txt"></span></div>
    <div class="m-grid" id="m-grid"></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
